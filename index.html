<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cake Lovely — Продажі</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./design-system/cardaq-system.css" />
    <link rel="stylesheet" href="./sales.css?v=20260720-7" />
  </head>
  <body>
    <div class="platform-loader" id="platformLoader" aria-label="Вибір міста">
      <div class="loader-content">
        <div class="loader-logo-stage">
          <div class="loader-logo" aria-hidden="true">
            <svg class="loader-piece loader-piece-left" viewBox="0 0 860 669" preserveAspectRatio="xMidYMid meet">
              <image href="./assets/logo.svg" width="2334" height="669" />
            </svg>
            <svg class="loader-piece loader-piece-mark" viewBox="850 0 628 669" preserveAspectRatio="xMidYMid meet">
              <image href="./assets/logo.svg" width="2334" height="669" />
            </svg>
            <svg class="loader-piece loader-piece-right" viewBox="1478 0 856 669" preserveAspectRatio="xMidYMid meet">
              <image href="./assets/logo.svg" width="2334" height="669" />
            </svg>
          </div>
        </div>
        <section class="city-picker" id="cityPicker" aria-label="Оберіть місто">
          <div class="city-grid">
            <button class="city-card" type="button" data-city="kharkiv">
              <img src="./IMG/CityKharkiv.png" alt="Харків" />
              <span>Харків</span>
            </button>
            <button class="city-card" type="button" data-city="lutsk">
              <img src="./IMG/CityLutsk.png" alt="Луцьк" />
              <span>Луцьк</span>
            </button>
          </div>
          <form class="city-login" id="cityLogin" hidden>
            <div class="city-login-head">
              <p class="city-login-title" id="cityLoginTitle">Вхід</p>
              <button class="city-login-back" type="button" id="cityLoginBack">Назад</button>
            </div>
            <label class="city-password-label" for="cityPassword">Пароль</label>
            <div class="city-login-row">
              <input class="city-password-input" id="cityPassword" type="password" inputmode="numeric" autocomplete="current-password" maxlength="32" required />
              <button class="button button-primary city-login-submit" type="submit">Увійти</button>
            </div>
            <p class="city-login-error" id="cityLoginError" role="alert"></p>
          </form>
        </section>
      </div>
    </div>
    <main class="container app-shell" aria-hidden="true">
      <section class="app-screen is-active" id="salesScreen">
        <div class="sales-sticky">
          <header class="app-header">
            <nav class="app-menu" aria-label="Розділи">
              <button class="mobile-menu-toggle" type="button" aria-label="Відкрити меню" aria-expanded="false">
                <svg class="mobile-menu-icon mobile-menu-icon--burger" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
                <svg class="mobile-menu-icon mobile-menu-icon--close" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
              </button>
              <button class="branch-exit" type="button" data-logout aria-label="Вийти й обрати інше місто" title="Обрати інше місто">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 5H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h4" /><path d="M14 8l4 4-4 4" /><path d="M18 12H9" /></svg>
              </button>
              <button class="nav-item app-view is-active" type="button" data-view="sales">Продажі</button>
              <button class="nav-item app-view" type="button" data-view="stats">Статистика</button>
            </nav>
            <div class="header-metrics" aria-label="Показники за сьогодні">
              <div class="header-count-card" title="Напої сьогодні">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M7 7h10l-1 12H8L7 7Z" />
                  <path d="M6 4h12" />
                  <path d="M12 4v3" />
                  <path d="M15 4 18 1" />
                </svg>
                <span id="todayDrinks">0</span>
              </div>
              <div class="header-count-card" title="Десерти сьогодні">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M8 10a4 4 0 0 1 8 0" />
                  <path d="M7 13h10" />
                  <path d="M8 13l1.2 5h5.6L16 13" />
                  <path d="M9 18h6" />
                  <path d="M10.5 7.5c0-1 .8-1.8 1.5-2.5.7.7 1.5 1.5 1.5 2.5" />
                </svg>
                <span id="todayDesserts">0</span>
              </div>
              <div class="revenue-badge">
                <p class="price-number" id="todayRevenue">0</p>
              </div>
            </div>
            <button class="branch-exit mobile-branch-exit" type="button" data-logout aria-label="Вийти й обрати інше місто" title="Обрати інше місто">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 5H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h4" /><path d="M14 8l4 4-4 4" /><path d="M18 12H9" /></svg>
            </button>
          </header>
          <div class="category-tabs" aria-label="Категорії товарів" id="categoryTabs"></div>
        </div>
        <div class="product-grid" id="productGrid"></div>
      </section>

      <section class="app-screen" id="statsScreen">
        <div class="stats-sticky">
          <header class="app-header">
            <nav class="app-menu" aria-label="Розділи">
              <button class="mobile-menu-toggle" type="button" aria-label="Відкрити меню" aria-expanded="false">
                <svg class="mobile-menu-icon mobile-menu-icon--burger" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
                <svg class="mobile-menu-icon mobile-menu-icon--close" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
              </button>
              <button class="branch-exit" type="button" data-logout aria-label="Вийти й обрати інше місто" title="Обрати інше місто">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 5H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h4" /><path d="M14 8l4 4-4 4" /><path d="M18 12H9" /></svg>
              </button>
              <button class="nav-item app-view" type="button" data-view="sales">Продажі</button>
              <button class="nav-item app-view" type="button" data-view="stats">Статистика</button>
            </nav>
            <button class="branch-exit mobile-branch-exit" type="button" data-logout aria-label="Вийти й обрати інше місто" title="Обрати інше місто">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 5H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h4" /><path d="M14 8l4 4-4 4" /><path d="M18 12H9" /></svg>
            </button>
          </header>
        </div>
        <div class="metrics-grid">
          <article class="account-card metric-card">
            <p class="price-label" id="dessertsSoldLabel">Десерти сьогодні</p>
            <div class="metric-value">
              <span class="metric-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false">
                  <path d="M8 10a4 4 0 0 1 8 0" />
                  <path d="M7 13h10" />
                  <path d="M8 13l1.2 5h5.6L16 13" />
                  <path d="M9 18h6" />
                  <path d="M10.5 7.5c0-1 .8-1.8 1.5-2.5.7.7 1.5 1.5 1.5 2.5" />
                </svg>
              </span>
              <p class="price-number" id="dessertsSold">0</p>
            </div>
          </article>
          <article class="account-card metric-card">
            <p class="price-label" id="drinksSoldLabel">Напої сьогодні</p>
            <div class="metric-value">
              <span class="metric-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false">
                  <path d="M7 7h10l-1 12H8L7 7Z" />
                  <path d="M6 4h12" />
                  <path d="M12 4v3" />
                  <path d="M15 4 18 1" />
                </svg>
              </span>
              <p class="price-number" id="drinksSold">0</p>
            </div>
          </article>
          <article class="account-card metric-card">
            <p class="price-label">Найкращий продавець</p>
            <div class="metric-value">
              <span class="metric-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false">
                  <circle cx="12" cy="8" r="3" />
                  <path d="M6.5 19c.6-3.3 2.4-5 5.5-5s4.9 1.7 5.5 5" />
                </svg>
              </span>
              <p class="price-number best-seller-value" id="bestSeller">—</p>
            </div>
          </article>
          <article class="account-card metric-card">
            <p class="price-label" id="totalRevenueLabel">Виручка сьогодні</p>
            <div class="metric-value">
              <span class="metric-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false">
                  <rect x="4" y="6" width="16" height="12" rx="1" />
                  <path d="M8 12h8" />
                  <circle cx="12" cy="12" r="2.5" />
                </svg>
              </span>
              <p class="price-number" id="totalRevenue">0</p>
            </div>
          </article>
        </div>

        <article class="account-card chart-card">
          <div class="card-row">
            <h2 class="card-title">Продажі</h2>
            <div class="nav-shell period-tabs" id="periodTabs">
              <button class="nav-item period-button is-active" type="button" data-period="days">За днями</button>
              <button class="nav-item period-button" type="button" data-period="months">За місяцями</button>
            </div>
          </div>
          <div class="chart" id="salesChart" aria-label="Графік продажів"></div>
        </article>

        <article class="account-card sales-table-card">
          <div class="card-row sales-table-head">
            <h2 class="card-title">Останні продажі</h2>
            <div class="sales-date-picker" id="salesDatePicker">
              <button class="sales-date-trigger" id="salesDateTrigger" type="button" aria-haspopup="dialog" aria-expanded="false">
                <span class="sales-date-label">Дата</span>
                <span class="sales-date-value" id="salesDateValue"></span>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M7 3.5v3" />
                  <path d="M17 3.5v3" />
                  <path d="M4.5 9h15" />
                  <rect x="4.5" y="5.5" width="15" height="15" rx="3" />
                </svg>
              </button>
              <div class="sales-calendar" id="salesCalendar" role="dialog" aria-label="Вибір дати продажів" hidden>
                <div class="sales-calendar-head">
                  <button class="sales-calendar-nav" id="salesCalendarPrev" type="button" aria-label="Попередній місяць">‹</button>
                  <p class="sales-calendar-title" id="salesCalendarTitle"></p>
                  <button class="sales-calendar-nav" id="salesCalendarNext" type="button" aria-label="Наступний місяць">›</button>
                </div>
                <div class="sales-calendar-weekdays" aria-hidden="true">
                  <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Нд</span>
                </div>
                <div class="sales-calendar-grid" id="salesCalendarGrid"></div>
                <button class="sales-calendar-today" id="salesCalendarToday" type="button">Сьогодні</button>
              </div>
            </div>
          </div>
          <div class="sales-table" id="recentSales"></div>
        </article>
      </section>
    </main>

    <dialog class="order-dialog" id="orderDialog">
      <form class="order-card" method="dialog" id="orderForm">
        <div class="order-head">
          <div class="order-head-copy">
            <h2 class="card-title" id="orderTitle">Новий чек</h2>
            <p class="card-text order-meta" id="orderMeta">0 позицій</p>
          </div>
          <label class="employee-discount-toggle" for="employeeDiscount">
            <span class="employee-discount-copy">
              <strong>Знижка для співробітників</strong>
              <small>−35% холодні напої · −40% десерти</small>
            </span>
            <input id="employeeDiscount" type="checkbox" />
            <span class="employee-discount-control" aria-hidden="true"></span>
          </label>
          <button class="button button-link close-button" type="button" id="closeDialog">Закрити</button>
        </div>
        <div class="order-layout">
          <section class="order-product">
            <div class="draft-items" id="draftItems"></div>
            <button class="button button-link add-more-button" type="button" id="addMoreItems">+ Додати ще</button>
          </section>

          <section class="order-controls">
            <div class="payment-switch">
              <button class="payment-button is-active" type="button" data-payment="cash">Готівка</button>
              <button class="payment-button" type="button" data-payment="card">Картка</button>
            </div>

            <label class="cash-field" id="cashField">
              <span class="price-label">Отримано готівкою</span>
              <input class="cash-input" id="cashInput" type="number" inputmode="decimal" min="0" step="1" />
            </label>

            <div class="totals-row">
              <div class="order-total">
                <p class="price-label">Сума замовлення</p>
                <p class="price-number" id="orderTotal">0</p>
              </div>
              <div class="order-total" id="changeRow">
                <p class="price-label">Решта</p>
                <p class="price-number" id="changeValue">0</p>
              </div>
            </div>
          </section>
        </div>

        <div class="order-footer">
          <button class="cancel-order-button is-hidden" type="button" id="cancelOrder">
            <span class="button-label-desktop">Скасувати замовлення</span>
            <span class="button-label-mobile">Скасувати</span>
          </button>
          <div class="employee-field" id="employeePicker">
            <button class="employee-trigger" id="employeeTrigger" type="button" aria-expanded="false" aria-controls="employeeOptions" aria-required="true">
              <span id="employeeValue">Ім’я співробітника <span class="required-mark" aria-hidden="true">*</span></span>
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m6 9 6 6 6-6" /></svg>
            </button>
            <div class="employee-options" id="employeeOptions" role="listbox" aria-label="Співробітник"></div>
          </div>
          <button class="button button-primary button-large confirm-button" type="submit">
            <span class="button-label-desktop">Підтвердити замовлення ›</span>
            <span class="button-label-mobile">Підтвердити ›</span>
          </button>
        </div>
      </form>
    </dialog>

    <dialog class="order-dialog top-up-dialog" id="topUpDialog">
      <form class="order-card top-up-card" method="dialog" id="topUpForm" novalidate>
        <div class="top-up-head">
          <h2 class="card-title">Доплата</h2>
          <button class="button button-link close-button" type="button" id="closeTopUpDialog">Закрити</button>
        </div>
        <div class="top-up-fields">
          <label class="cash-field">
            <span class="price-label">Номер замовлення</span>
            <input class="cash-input" id="topUpOrderNumber" type="text" inputmode="numeric" />
          </label>
          <label class="cash-field field-with-error">
            <span class="price-label">Сума доплати</span>
            <input class="cash-input" id="topUpAmount" type="number" inputmode="decimal" min="1" step="1" required aria-describedby="topUpAmountError" />
            <span class="field-error" id="topUpAmountError" role="alert">Вкажіть суму доплати</span>
          </label>
        </div>
        <button class="button button-primary button-large confirm-button" type="submit">Підтвердити ›</button>
      </form>
    </dialog>

    <script src="./sales.js?v=20260720-7"></script>
  </body>
</html>
